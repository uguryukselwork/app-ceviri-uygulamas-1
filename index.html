<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Çeviri uygulaması 1</title>
    <meta name="description" content="A real-time translation messaging app for couples and friends speaking different languages." />
    <meta property="og:title" content="Çeviri uygulaması 1" />
    <meta property="og:description" content="A real-time translation messaging app for couples and friends speaking different languages." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LiveTranslate" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Prevent bounce and keep fixed layout on mobile -->
    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
    </style>
    <script>
      try {
        const stored = localStorage.getItem('live-translate-storage');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed?.state?.colorTheme) {
            document.documentElement.setAttribute('data-color-theme', parsed.state.colorTheme);
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
